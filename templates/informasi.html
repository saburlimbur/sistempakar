<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <title>Sistem Pakar | Informasi Gejala</title>
  </head>
  <body class="font-sans">
    <main class="bg-[#f8fafc] w-screen h-screen flex font-sans">
      <!-- sidebar -->
      <aside class="w-1/5 h-full bg-[#1e293b] text-white px-6 py-10 shadow-xl flex flex-col justify-between rounded-tr-3xl rounded-br-3xl">
        <div>
          <h2 class="text-2xl font-bold text-center text-sky-400 mb-10">Sistem Pakar Flu</h2>
          <nav class="flex flex-col gap-6">
            <a href="{{ url_for('home_page') }}" class="flex items-center gap-3 hover:bg-[#263144] p-3 rounded-md transition">
              <div class="p-2 bg-sky-200 text-sky-600 rounded-md">
                <i data-lucide="home"></i>
              </div>
              <span class="font-medium text-gray-300">Dashboard</span>
            </a>

            <a href="{{ url_for('diagnosa_page') }}" class="flex items-center gap-3 hover:bg-[#263144] p-3 rounded-md transition">
              <div class="p-2 bg-green-200 text-green-600 rounded-md">
                <i data-lucide="stethoscope"></i>
              </div>
              <span class="font-medium text-gray-300">Diagnosa Gejala</span>
            </a>

            <a href="{{ url_for('riwayat_page') }}" class="flex items-center gap-3 hover:bg-[#263144] p-3 rounded-md transition">
              <div class="p-2 bg-orange-200 text-orange-600 rounded-md">
                <i data-lucide="history"></i>
              </div>
              <span class="font-medium text-gray-300">Riwayat Diagnosa</span>
            </a>

            <a href="{{ url_for('informasi_page') }}" class="flex items-center gap-3 bg-[#263144] p-3 rounded-md transition">
              <div class="p-2 bg-yellow-200 text-yellow-600 rounded-md">
                <i data-lucide="alert-triangle"></i>
              </div>
              <span class="font-medium text-gray-300">Informasi Gejala</span>
            </a>

            <a href="#" class="flex items-center gap-3 hover:bg-[#263144] p-3 rounded-md transition">
              <div class="p-2 bg-purple-200 text-purple-600 rounded-md">
                <i data-lucide="info"></i>
              </div>
              <span class="font-medium text-gray-300">Tentang Sistem</span>
            </a>
          </nav>
        </div>

        <div class="mt-8">
          <a href="#" class="flex items-center gap-3 hover:bg-[#263144] p-3 rounded-md transition">
            <div class="p-2 bg-red-100 text-red-600 rounded-md">
              <i data-lucide="log-out"></i>
            </div>
            <span class="font-medium">Keluar</span>
          </a>
        </div>
      </aside>

      <!-- content -->
      <section class="flex-1 p-10">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Selamat datang!</h1>
        <p class="text-gray-600">Silakan mulai diagnosa flu dengan memilih menu di sebelah kiri.</p>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
